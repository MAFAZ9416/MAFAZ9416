<svg width="900" height="90" viewBox="0 0 900 90" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#111117"/>
      <stop offset="100%" style="stop-color:#0D0D0F"/>
    </linearGradient>
    <linearGradient id="footerDiv" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9D4EDD;stop-opacity:0"/>
      <stop offset="20%" style="stop-color:#9D4EDD;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#00F5FF;stop-opacity:1"/>
      <stop offset="80%" style="stop-color:#B5FF4D;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#B5FF4D;stop-opacity:0"/>
    </linearGradient>
    <style>
      @keyframes heartPulse { 0%,100%{opacity:0.8;transform:scale(1)} 50%{opacity:1;transform:scale(1.2)} }
      .heart{animation:heartPulse 1.5s ease-in-out infinite; transform-origin:450px 55px}
    </style>
  </defs>

  <!-- Background -->
  <rect width="900" height="90" fill="url(#footerBg)"/>

  <!-- Top divider -->
  <rect x="0" y="0" width="900" height="2" fill="url(#footerDiv)"/>

  <!-- Closing statement -->
  <text x="450" y="35" font-family="'Arial', sans-serif" font-size="12" fill="#8888AA" text-anchor="middle" font-style="italic">"Thanks for visiting. Let's build something great together."</text>

  <!-- Crafted by line with animated heart -->
  <text x="450" y="58" font-family="'Courier New', monospace" font-size="10" fill="#555570" text-anchor="middle">Crafted with</text>
  <text x="535" y="58" font-family="'Arial', sans-serif" font-size="12" fill="#9D4EDD" text-anchor="middle" class="heart">♥</text>
  <text x="560" y="58" font-family="'Courier New', monospace" font-size="10" fill="#555570">by</text>
  <text x="596" y="58" font-family="'Courier New', monospace" font-size="10" fill="#C77DFF" font-weight="bold">MOHAMMED MAFAZ</text>

  <!-- Bottom accent line -->
  <rect x="0" y="88" width="900" height="2" fill="url(#footerDiv)"/>

  <!-- Corner decorations -->
  <rect x="0" y="0" width="2" height="90" fill="#9D4EDD" opacity="0.5"/>
  <rect x="898" y="0" width="2" height="90" fill="#B5FF4D" opacity="0.5"/>
</svg>
