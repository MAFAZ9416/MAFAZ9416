name: Update GitHub Streak Stats

on:
  schedule:
    # Runs daily at 03:00 UTC
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak-stats.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Streak Stats SVG
        uses: DenverCoder1/github-readme-streak-stats@v2
        with:
          user: MAFAZ9416
          theme: transparent
          background: 161622
          border: 1E1E2E
          ring: 9D4EDD
          fire: C77DFF
          currStreakLabel: 00F5FF
          sideLabels: 8888AA
          dates: 555570
          border_radius: 12
          date_format: "M j[, Y]"
          output_path: assets/github-streak.svg

      - name: Commit and push streak SVG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/github-streak.svg
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update streak stats [skip ci]"
          git push
