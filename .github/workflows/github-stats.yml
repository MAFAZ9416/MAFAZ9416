name: Update GitHub Profile Analytics

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.SUMMARY_GITHUB_TOKEN }}
        with:
          USERNAME: MAFAZ9416
          BRANCH_NAME: main
          TIME_ZONE: Asia/Kolkata
          THEME: github_dark
          ANIMATION: rise
          AUTO_PUSH: true
